<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="#0a0a0a"/>
  <g transform="translate(48, 48)">
    <!-- Classroom door/window outline -->
    <rect x="0" y="0" width="96" height="96" fill="none" stroke="url(#grad1)" stroke-width="4" rx="8"/>
    <!-- Desk grid -->
    <line x1="16" y1="32" x2="80" y2="32" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="16" y1="48" x2="80" y2="48" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="16" y1="64" x2="80" y2="64" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="16" y1="80" x2="80" y2="80" stroke="url(#grad1)" stroke-width="2"/>
    <!-- Door/entrance -->
    <circle cx="48" cy="88" r="6" fill="url(#grad1)"/>
  </g>
</svg>